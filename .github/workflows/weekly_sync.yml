name: Weekly Sync to Hugging Face

on:
  schedule:
    # 03:00 UTC = 04:00 CET (Standard Time)
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      from_date:
        description: 'Optional backfill start (YYYY-MM-DD; default 60 days ago)'
        type: string
      to_date:
        description: 'Optional backfill end (YYYY-MM-DD; default 14 days ago)'
        type: string
      retry_empty:
        description: 'Also retry existing zero-row files'
        type: boolean
        default: true

jobs:
  miner-and-upload:
    runs-on: ubuntu-latest
    # Cap the job well below the GH Actions 6h default. If a slow Cellar endpoint
    # makes the miner hang, we fail fast and the next weekly run picks up the gaps.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 75 || 30 }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET: do-me/EUR-LEX
      # Reversible: remove/set to 0 to use the prior Polars writer.
      EURLEX_COMPACT_PARQUET: '1'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Test query limits and pagination
        id: query-tests
        run: uv run python -m unittest discover -s tests -p 'test_sparql_pagination.py' -v

      # Seed ./files/ with the current year's existing parquets from HF so the
      # backfill step can see which dates are already present. HF caches by
      # content hash, so this only transfers the bytes for files we don't have.
      # Steady-state this is one full year (~80 MB); the upload at the end will
      # be a no-op for unchanged files (same content hash).
      - name: Seed local files from HF (current year)
        id: seed
        run: |
          export YEAR=$(date -u +%Y)
          echo "Seeding files/$YEAR/ from $HF_DATASET"
          uv run --with huggingface_hub python -c "
          import os
          from huggingface_hub import snapshot_download
          year = os.environ['YEAR']
          snapshot_download(
              repo_id=os.environ['HF_DATASET'],
              repo_type='dataset',
              local_dir='.',
              allow_patterns=[f'files/{year}/*.parquet'],
          )
          "

      # Self-healing backfill runs FIRST: re-mine any date in the [60d, 14d]
      # window that is either missing on disk or has a 0-row parquet. The TO
      # bound (14 days ago) is exactly contiguous with the lookback step below,
      # which covers today-13 .. today. Steady-state this is a near-noop
      # (everything seeded already has rows); after an outage it back-fills the
      # gap over as many weekly runs as needed. Higher priority than lookback
      # because missing old dates can only be recovered here.
      - name: Self-healing backfill (14-60 days back)
        timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 45 || 15 }}
        # A timed-out backfill is partial progress, not a job failure.
        continue-on-error: true
        env:
          BACKFILL_FROM: ${{ inputs.from_date }}
          BACKFILL_TO: ${{ inputs.to_date }}
          RETRY_EMPTY: ${{ github.event_name != 'workflow_dispatch' || inputs.retry_empty }}
        run: |
          FROM="${BACKFILL_FROM:-$(date -u -d '60 days ago' +%Y-%m-%d)}"
          TO="${BACKFILL_TO:-$(date -u -d '14 days ago' +%Y-%m-%d)}"
          EXTRA=()
          if [ "$RETRY_EMPTY" = "true" ]; then EXTRA+=(--retry-empty); fi
          echo "Backfilling missing/empty parquets in [$FROM .. $TO]"
          uv run eur_lex_miner dataset_ \
            --backfill-missing "${EXTRA[@]}" \
            --from-date "$FROM" --to-date "$TO" \
            --lang ENG --unique-on celex

      # Refresh the most recent 14 days every week so late-arriving documents
      # (Cellar back-fills its index) get picked up. Runs even if the backfill
      # step was cancelled by its own timeout.
      - name: Refresh recent window (last 14 days)
        if: ${{ !cancelled() && steps.query-tests.outcome == 'success' && steps.seed.outcome == 'success' }}
        timeout-minutes: 10
        # A timed-out lookback is partial progress, not a job failure.
        continue-on-error: true
        run: |
          uv run eur_lex_miner dataset_ --lookback 14 --unique-on celex --lang ENG

      # Validate new files before they are published. Existing seeded files
      # are never included in this validation's upload candidate set.
      - name: Validate new daily files
        id: validate
        if: ${{ !cancelled() && steps.query-tests.outcome == 'success' && steps.seed.outcome == 'success' }}
        run: uv run --with huggingface_hub python scripts/validate_new_files.py

      - name: Run Upload Script
        id: upload
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: uv run --with huggingface_hub python scripts/upload_to_hf.py

      # The miner keeps this file to unresolved failures only. Both the
      # backfill and 14-day refresh update it after every attempted date.
      - name: Persist missing-date log
        if: ${{ !cancelled() && steps.upload.outcome == 'success' }}
        run: |
          if git diff --quiet -- missing_dates.csv; then
            echo "Missing-date log unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add missing_dates.csv
          git commit -m "Update missing-date log [skip ci]"
          git push
